<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:900px;background:#f2f3f5;font-family:"PingFang SC","Helvetica Neue",sans-serif;color:#1f2329}
.top{height:56px;background:#fff;border-bottom:1px solid #e5e6eb;display:flex;align-items:center;padding:0 28px;font-size:17px;font-weight:600}
.top span{color:#86909c;font-weight:400;margin-left:12px;font-size:14px}
.wrap{display:flex}
.side{width:180px;height:844px;background:#fff;border-right:1px solid #e5e6eb;padding:20px 0}
.side div{padding:12px 28px;font-size:15px;color:#4e5969}.side .on{background:#eef3ff;color:#2d5bd7;font-weight:600}
.main{flex:1;padding:24px 28px}
.card{background:#fff;border-radius:10px;padding:22px 26px;margin-bottom:18px}
.work{display:flex;gap:20px;align-items:center}
.cover{width:96px;height:128px;border-radius:8px;background:linear-gradient(160deg,#1b1340,#6b2fbf 55%,#ff4fa3)}
.wt{font-size:20px;font-weight:600;margin-bottom:10px}.wm{font-size:14px;color:#86909c;line-height:1.9}
h3{font-size:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.m{background:#f7f8fa;border-radius:8px;padding:16px 18px}
.m .k{font-size:14px;color:#86909c;margin-bottom:8px}.m .v{font-size:30px;font-weight:700;letter-spacing:.5px}
.m .s{font-size:12px;color:#86909c;margin-top:6px}
.warn .v{color:#d9363e}
.row{display:flex;gap:40px;font-size:15px;color:#4e5969}.row b{color:#1f2329;font-size:18px;margin-left:6px}
</style></head><body>

<div class="main">

<div class="wm">发布时间：2026-10-21 14:07<br>视频时长：45 秒<br>数据更新至：2026-10-31 23:59</div></div></div>

<div class="m"><div class="k">播放量</div><div class="v">380</div></div>
<div class="m"><div class="k">封面点击率</div><div class="v">2.3%</div></div>
<div class="m warn"><div class="k">2 秒跳出率</div><div class="v">61%</div></div>
<div class="m"><div class="k">5 秒完播率</div><div class="v">22%</div></div>
<div class="m warn"><div class="k">完播率</div><div class="v">4.1%</div><div class="s">同类作品参考：18%</div></div>
<div class="m"><div class="k">平均播放时长</div><div class="v">3.2 秒</div></div>
<div class="m"><div class="k">新增关注</div><div class="v">2</div></div>
<div class="m"><div class="k">主页访问</div><div class="v">14</div></div>
</div></div>

</div></div></body></html>
